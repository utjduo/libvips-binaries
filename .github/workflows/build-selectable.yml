name: Build (selectable OS + codecs)

# Alternative to build.yml: pick exactly which operating systems and which
# optional codecs to compile, then download every platform as a workflow
# artifact. Setting a boolean OS toggle to false removes the runner entirely
# (the `prepare` job computes the matrix), so you only pay for what you build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "libvips version (e.g. 8.18.7)"
        required: true
        default: "8.18.7"
        type: string
      mac_x64:
        description: "Build macOS x86_64 (darwin-x64)"
        required: false
        default: true
        type: boolean
      mac_arm:
        description: "Build macOS arm64 (darwin-arm64)"
        required: false
        default: true
        type: boolean
      linux_x64:
        description: "Build Linux x86_64 (linux-x64)"
        required: false
        default: true
        type: boolean
      linux_arm:
        description: "Build Linux arm64 (linux-arm64)"
        required: false
        default: true
        type: boolean
      win_x64:
        description: "Build Windows x86_64 (win-x64)"
        required: false
        default: true
        type: boolean
      codecs:
        description: >-
          Optional codecs to build: comma-separated list, or "all"/"default".
          Extra codecs: spng, openjpeg, openexr, jpeg-xl, fftw, cfitsio, matio, raw.
          Built-in formats: ppm, analyze, radiance, qoi, nsgif.
          jpeg, png, webp, gif loading, heif/avif and lcms are always included;
          tiff, dzsave, svgload, textload, UltraHDR, the GIF quantiser, exif and
          the HEVC encoder depend on the "preset" and "features" inputs below.
        required: false
        default: "all"
        type: string
      preset:
        description: >-
          Build preset: "full" keeps everything; "lean" (default) drops
          librsvg (svgload), the Pango/Cairo text stack (textload), libuhdr
          (UltraHDR) and x265 (HEVC encode) - AVIF encode/decode and HEIC decode
          stay; "aggressive" drops libtiff (tiffload/tiffsave) and libarchive
          (dzsave) as well, plus libimagequant, which removes gifsave (GIF
          loading still works); "image" is "aggressive" but keeps libimagequant
          so GIF saving works. The old numbers are accepted too (0, 1, 2).
        required: false
        default: "lean"
        type: choice
        options:
          - "lean"
          - "full"
          - "aggressive"
          - "image"
          - "0"
          - "1"
          - "2"
      features:
        description: >-
          Switch single features on top of the preset, as comma-separated
          name=on|off pairs: svgload, textload, uhdr, tiffload, dzsave,
          imagequant, exif, lcms, heif_dec (HEIC decode), heif_enc (HEVC/HEIC
          encode through x265). Example: heif_enc=on,imagequant=on
        required: false
        default: ""
        type: string
      create_release:
        description: "Create a GitHub Release with all built artifacts"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build matrix from platform selection
        id: set
        env:
          MAC_X64: ${{ inputs.mac_x64 }}
          MAC_ARM: ${{ inputs.mac_arm }}
          LINUX_X64: ${{ inputs.linux_x64 }}
          LINUX_ARM: ${{ inputs.linux_arm }}
          WIN_X64: ${{ inputs.win_x64 }}
        run: |
          matrix='{"include":['
          sep=''
          add() {
            # $1 = runner label, $2 = platform name, $3 = enabled ("true"/"false")
            if [ "$3" = "true" ]; then
              matrix="${matrix}${sep}{\"os\":\"$1\",\"platform\":\"$2\"}"
              sep=','
            fi
          }
          add "macos-15"         "darwin-arm64" "$MAC_ARM"
          add "macos-15-intel"   "darwin-x64"   "$MAC_X64"
          add "ubuntu-24.04"     "linux-x64"    "$LINUX_X64"
          add "ubuntu-24.04-arm" "linux-arm64"  "$LINUX_ARM"
          add "windows-2025"     "win-x64"      "$WIN_X64"
          matrix="${matrix}]}"
          if [ -z "$sep" ]; then
            echo "::error::No platforms selected - enable at least one OS."
            exit 1
          fi
          echo "Selected matrix: ${matrix}"
          echo "Selected codecs: ${CODECS}"
          echo "Selected presets: ${PRESET}"
          echo "Selected features: ${FEATURES}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CODECS: ${{ inputs.codecs }}
      PRESET: ${{ inputs.preset }}
      FEATURES: ${{ inputs.features }}
      # posix.sh keeps the macOS Rust toolchain here rather than inside deps/, which
      # is wiped between runs, so the cache step below can hand it back next time.
      RUST_CACHE: ${{ github.workspace }}/.rust-cache
    steps:
      - uses: actions/checkout@v6

      # Every dependency source is pinned in versions.properties, so an archive is the
      # same bytes on the next run and build-scripts/fetch.sh can unpack it from
      # .dl-cache instead of downloading it again - that removes ~40 fetches, including
      # the libvips and libjxl tarballs, from a build.  Keys are per platform because
      # each platform builds a different subset of the dependency list; the version is
      # in the key so a new libvips release cannot reuse the old tarball.
      - name: Cache dependency sources
        uses: actions/cache@v6
        with:
          path: .dl-cache
          key: dl-${{ matrix.platform }}-${{ inputs.version }}-${{ hashFiles('versions.properties') }}
          restore-keys: |
            dl-${{ matrix.platform }}-${{ inputs.version }}-
            dl-${{ matrix.platform }}-

      # Bottles and wheels for the tools the macOS build installs.
      - name: Cache macOS tool downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/.cache/pip
          key: mac-tools-${{ runner.arch }}-${{ hashFiles('.github/workflows/build-selectable.yml') }}

      # rustup + cargo-c, which posix.sh installs on macOS to build librsvg; cargo-c is
      # compiled from crates, so reusing it saves several minutes.  Keyed on the script
      # that installs them: a change there rebuilds the toolchain rather than reusing
      # one built with different options.
      - name: Cache Rust toolchain (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: .rust-cache
          key: rust-${{ matrix.platform }}-${{ hashFiles('build-scripts/posix.sh') }}
          restore-keys: |
            rust-${{ matrix.platform }}-

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pipx install meson
          brew install automake nasm

      # setup-msys2 caches the MSYS2 installation and its pacman package downloads
      # between runs by default; it is spelled out here because `update: true` runs a
      # full pacman upgrade, which is only cheap when those packages are cached.
      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'win-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            patch
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Update version
        shell: bash
        run: |
          sed -i.bak "s/^VERSION_VIPS=.*/VERSION_VIPS=${{ inputs.version }}/" versions.properties

      - name: Build (Windows / MSYS2)
        if: matrix.platform == 'win-x64'
        shell: msys2 {0}
        run: bash build.sh win-x64

      # A failed Windows build otherwise shows nothing but "exit code 1" in the
      # Actions log: the messages that explain it - meson's dependency
      # resolution, a configure run that gave up, CMake's package detection -
      # are written into files under deps/ and are discarded with the runner.
      # Keep them whenever the build fails so the cause is readable.
      - name: Upload build logs (on failure)
        if: failure() && matrix.platform == 'win-x64'
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ matrix.platform }}
          path: |
            deps/pkgconfig-probe.log
            deps/vips/_build/meson-logs/meson-log.txt
            deps/*/_build/meson-logs/meson-log.txt
            deps/*/config.log
            deps/*/CMakeCache.txt
            deps/**/CMakeFiles/CMake*.log
          if-no-files-found: ignore
          retention-days: 7

      # The Linux builds run inside a container whose image is the entire toolchain
      # (dnf packages, rustup + cargo-c, meson/ninja).  BuildKit stores those layers in
      # the GitHub Actions cache backend, so only the dependency build itself runs
      # again; --pull is still used, and a new rockylinux:8 digest invalidates the
      # cached layers, so the toolchain cannot drift silently.
      - name: Set up Docker Buildx
        if: matrix.platform == 'linux-x64' || matrix.platform == 'linux-arm64'
        uses: docker/setup-buildx-action@v4

      - name: Build (Unix)
        if: matrix.platform != 'win-x64'
        env:
          DOCKER_BUILD_CACHE: ${{ (matrix.platform == 'linux-x64' || matrix.platform == 'linux-arm64') && '1' || '' }}
        run: bash build.sh ${{ matrix.platform }}

      # The build scripts already smoke test the build tree, which is the right
      # place to fail fast, but that is not always the library that ships:
      # posix.sh deletes target/lib/pkgconfig, copies the library with cp -L,
      # rewrites its install name to @rpath/... and renames libvips-cpp.so.* to
      # libvips.so.42 after that test has run, and Linux builds happen inside a
      # container.  These steps unpack the finished tarball in an empty directory
      # and compile a consumer program against it with the runner's own compiler,
      # then the table lands in the job summary.  They run before the upload, so
      # an archive that cannot be linked is never published.
      - name: Smoke test the package (Windows / MSYS2)
        if: matrix.platform == 'win-x64'
        shell: msys2 {0}
        run: bash build-scripts/smoke-package.sh libvips-${{ matrix.platform }}.tar.gz

      - name: Smoke test the package
        if: matrix.platform != 'win-x64'
        shell: bash
        run: bash build-scripts/smoke-package.sh libvips-${{ matrix.platform }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.platform }}
          path: "libvips-*.tar.gz"
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  create-release:
    if: inputs.create_release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Generate release notes
        run: |
          cat > release-notes.md <<EOF
          # libvips ${{ inputs.version }} binaries

          Codecs: \`${{ inputs.codecs }}\`

          Preset: \`${{ inputs.preset }}\`${{ inputs.features && format(' (features: {0})', inputs.features) || '' }}

          | Asset | Platform |
          |-------|----------|
          $(for f in libvips-*.tar.gz; do echo "| \`$f\` | ${f#libvips-} |"; done)
          EOF

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.version }}
          name: "libvips ${{ inputs.version }}"
          artifacts: "libvips-*.tar.gz"
          bodyFile: release-notes.md
          makeLatest: true
