name: Build and Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'libvips version (e.g. 8.15.3)'
        required: true
        type: string
      platforms:
        description: 'Platforms to build (comma-separated, empty = all): darwin-arm64, darwin-x64, linux-x64, linux-arm64, win-x64'
        required: false
        default: ''
        type: string
      create_release:
        description: 'Create a GitHub Release with the built artifacts'
        required: false
        default: false
        type: boolean
      codecs:
        description: >-
          Optional codecs to build: comma-separated list, or "all"/"default".
          Extra codecs: spng, openjpeg, openexr, jpeg-xl, fftw, cfitsio, matio, raw.
          Built-in formats: ppm, analyze, radiance, qoi, nsgif.
        required: false
        default: 'all'
        type: string
      preset:
        description: >-
          Build preset: "full" keeps everything; "lean" drops librsvg (svgload),
          the Pango/Cairo text stack (textload), libuhdr (UltraHDR) and the x265
          HEVC encoder; "aggressive" also drops libtiff (tiffload/tiffsave),
          libarchive (dzsave) and libimagequant (quantisation, and with it
          gifsave - GIF loading still works); "image" is "aggressive" but keeps
          libimagequant so GIF saving works. The old numbers work too
          (0 = full, 1 = lean, 2 = aggressive). Affects every platform.
        required: false
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'lean'
          - 'aggressive'
          - 'image'
          - '0'
          - '1'
          - '2'
      features:
        description: >-
          Switch single features on top of the preset, as comma-separated
          name=on|off pairs: svgload, textload, uhdr, tiffload, dzsave,
          imagequant, exif, lcms, heif_dec, heif_enc.
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      CODECS: ${{ inputs.codecs }}
      PRESET: ${{ inputs.preset }}
      FEATURES: ${{ inputs.features }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win-x64

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pipx install meson
          brew install automake nasm

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'win-x64' && (inputs.platforms == '' || contains(inputs.platforms, matrix.platform))
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            patch
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Update version
        shell: bash
        run: |
          sed -i.bak "s/^VERSION_VIPS=.*/VERSION_VIPS=${{ inputs.version }}/" versions.properties

      - name: Build (Windows / MSYS2)
        if: matrix.platform == 'win-x64' && (inputs.platforms == '' || contains(inputs.platforms, matrix.platform))
        shell: msys2 {0}
        run: bash build.sh win-x64

      - name: Build (Unix)
        if: matrix.platform != 'win-x64' && (inputs.platforms == '' || contains(inputs.platforms, matrix.platform))
        run: bash build.sh ${{ matrix.platform }}

      - name: Upload artifact
        if: inputs.platforms == '' || contains(inputs.platforms, matrix.platform)
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.platform }}
          path: 'libvips-*.tar.gz'
          compression-level: 0
          retention-days: 1

  create-release:
    if: inputs.create_release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Generate release notes
        run: |
          cat > release-notes.md <<EOF
          # libvips ${{ inputs.version }} binaries

          Pre-built shared libraries for all supported platforms.

          | Asset | Platform |
          |-------|----------|
          $(for f in libvips-*.tar.gz; do echo "| \`$f\` | ${f#libvips-} |"; done)
          EOF

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.version }}
          name: "libvips ${{ inputs.version }}"
          artifacts: 'libvips-*.tar.gz'
          bodyFile: release-notes.md
          makeLatest: true
